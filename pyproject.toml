[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "circover"
version = "0.1.0"
description = "NHOP metric, geometry-preserving seed selection, and circular oversampling (GVM-CO, LRE-CO, LS-CO)"
authors = [{name = "Parsa Hajiannejad"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "scipy>=1.10",
    "imbalanced-learn>=0.11",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["src/circover"]
